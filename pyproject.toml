[project]
name = "iec104-tester"
version = "1.12.0"
description = "IEC 60870-5-104 协议测试工具 — 主站/子站模拟器"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "IEC104 Tester"}
]

dependencies = [
    "PyYAML>=6.0",
    "aiohttp>=3.14.4",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# WP8：原生 PDF 报告（未安装时 html/xlsx 仍可用，PDF 端点返回 400 + 安装提示）
pdf = [
    "reportlab>=4.0",
]
build = [
    "pyinstaller>=6.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "psutil>=5.9",
    "ruff>=0.6",
]

[project.scripts]
iec104-tester = "app:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "webui*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["venv", "build/dist", "test_reports"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501",   # line too long — 协议构造代码行宽不固定，交由 formatter
    "SIM105", # try/except/pass 有时是有意为之的降级
    "SIM102", # 嵌套 if 合并 — 协议分支代码拆开更可读
    "SIM108", # 三元表达式强制 — if/else 块在协议代码中更清晰
    "UP041",  # asyncio.TimeoutError 在 3.11+ 即内置 TimeoutError；Phase 0 不改业务源码，保留原写法
]

[tool.ruff.lint.per-file-ignores]
# 测试中断言显式布尔比较、嵌套 with 是常见且可读的写法
"tests/**" = ["E712", "SIM117"]

[tool.ruff.lint.isort]
known-first-party = ["core", "webui"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 性能/长稳基准默认不跑（避免拖慢日常全量测试与 CI）；显式 `pytest -m perf` 运行。
addopts = '-m "not perf"'
markers = [
    "perf: 性能/长稳基准（默认排除，pytest -m perf 显式运行）",
]

[tool.coverage.run]
# 分支覆盖：行覆盖会漏掉“条件只走了一半”的编解码分支；CI 门禁 88% 为分支口径。
branch = true
