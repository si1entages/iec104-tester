name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install PyYAML aiohttp
          pip install pytest pytest-asyncio pytest-cov
      - name: Run tests
        # --basetemp：把 pytest 临时根固定为仓库内目录（每次会话开始即被 pytest
        # 清空重建），避免默认的共享临时根（如 %TEMP%/pytest-of-<user>）无界累积
        # pytest-N / garbage-* 目录。累积到一定数量会拖慢收集，并在带「批量删除
        # 需确认」类安全钩子的环境里截断输出、把退出码变成 1（假失败）。
        run: pytest tests/ -q --cov=core --cov-report=term-missing --cov-fail-under=88 --basetemp=.pytest-tmp

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: webui/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check & build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webui-spa
          path: webui/static/app
          if-no-files-found: error
