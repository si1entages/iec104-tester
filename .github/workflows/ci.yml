name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# 同一分支的新 push 取消旧 run，避免全矩阵重复占用 runner。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check .

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 支持范围两端 + 当前主力版本；3.14 为本机开发版本，纳入防漂移。
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          pip install PyYAML aiohttp openpyxl
          pip install pytest pytest-asyncio pytest-cov hypothesis psutil
      - name: Run tests
        # --basetemp：把 pytest 临时根固定为仓库内目录（每次会话开始即被 pytest
        # 清空重建），避免默认的共享临时根（如 %TEMP%/pytest-of-<user>）无界累积
        # pytest-N / garbage-* 目录。累积到一定数量会拖慢收集，并在带「批量删除
        # 需确认」类安全钩子的环境里截断输出、把退出码变成 1（假失败）。
        run: pytest tests/ -q --cov=core --cov=webui --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=91 --basetemp=.pytest-tmp
      - name: WebUI coverage gate (>=85%)
        # 后端 core 与 webui 分开设门禁：webui 处理函数众多，合并统计会被 core
        # 的高覆盖率掩盖。85% 为当前实测（91%）留出的抖动余量。
        run: coverage report --include="webui/*" --fail-under=85
      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  # 协议层变异冒烟（12 个高价值变异，约 10s）：防止测试对编解码边界“假绿”。
  mutation-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          pip install PyYAML aiohttp openpyxl
          pip install pytest pytest-asyncio
      - name: Mutation smoke
        run: python tools/mutation_smoke.py

  # Windows 打包回归：产品主要分发形态是 exe，而代码/测试矩阵在 Ubuntu 上跑，
  # 打包链路（PyInstaller + 前端 dist 收集）此前从未在 CI 验证。
  # 本 job 产出 onedir 包并真实启动**同一个 exe** 的主站/子站角色，检查
  # /api/status 与 /app/ 可用（单文件发布：一个 iec104-tester 支持 --mode）。
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: webui/frontend/package-lock.json
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build frontend
        working-directory: webui/frontend
        run: |
          npm ci
          npm run build
      - name: Visual regression (Windows baseline)
        shell: pwsh
        env:
          CI: "true"
          E2E_PY: python
          E2E_CHANNEL: msedge
          NODE_PATH: ${{ github.workspace }}\webui\frontend\node_modules
        run: |
          & "webui/frontend/node_modules/.bin/playwright.cmd" test `
            --config tests/e2e/playwright.config.ts tests/e2e/specs/visual.spec.ts
      - name: Build exe (onedir)
        run: python build/build_all.py --skip-frontend
      - name: Smoke packaged master
        shell: pwsh
        run: |
          $exe = "dist/iec104-tester/iec104-tester.exe"
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          $proc = Start-Process -FilePath $exe -ArgumentList @("--mode", "master", "--no-browser", "--no-history", "--http-port", "18765") -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Seconds 1
              try {
                $status = Invoke-RestMethod -Uri "http://127.0.0.1:18765/api/status" -TimeoutSec 2
                if ($status.role -eq "master") { $ready = $true; break }
              } catch {}
            }
            if (-not $ready) { throw "packaged master did not become ready" }
            $app = Invoke-WebRequest -Uri "http://127.0.0.1:18765/app/" -UseBasicParsing -TimeoutSec 5
            if ($app.StatusCode -ne 200) { throw "SPA /app/ returned $($app.StatusCode)" }
          } finally {
            taskkill /F /T /PID $proc.Id 2>$null | Out-Null
          }
      - name: Smoke packaged slave
        shell: pwsh
        run: |
          $exe = "dist/iec104-tester/iec104-tester.exe"
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          $proc = Start-Process -FilePath $exe -ArgumentList @("--mode", "slave", "--no-browser", "--no-history", "--http-port", "18766") -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Seconds 1
              try {
                $status = Invoke-RestMethod -Uri "http://127.0.0.1:18766/api/status" -TimeoutSec 2
                if ($status.role -eq "slave") { $ready = $true; break }
              } catch {}
            }
            if (-not $ready) { throw "packaged slave did not become ready" }
          } finally {
            taskkill /F /T /PID $proc.Id 2>$null | Out-Null
          }
      - name: Upload packaged executables
        uses: actions/upload-artifact@v7
        with:
          name: iec104-windows-onedir
          path: dist/
          if-no-files-found: error

  # 发布流水线只在打 tag 时跑 onefile；PR 阶段用 Linux onefile 做 dry-run，
  # 避免「tag 推上去才发现 PyInstaller 单文件路径坏了」。
  packaging-onefile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: webui/frontend/package-lock.json
      - name: Build frontend
        working-directory: webui/frontend
        run: |
          npm ci
          npm run build
      - name: Build one-file executable
        run: |
          python -m pip install -r requirements.txt pyinstaller
          python build/build_all.py --skip-frontend --onefile
      - name: Smoke one-file master
        shell: bash
        run: |
          ./dist/iec104-tester --mode master --no-browser --no-history --http-port 18765 &
          PID=$!
          trap "kill $PID 2>/dev/null || true" EXIT
          ready=0
          for i in $(seq 1 90); do
            sleep 1
            if python -c 'import json,sys,urllib.request; d=json.load(urllib.request.urlopen("http://127.0.0.1:18765/api/status", timeout=2)); sys.exit(0 if d.get("role")=="master" else 1)' 2>/dev/null; then
              ready=1; break
            fi
          done
          if [ "$ready" != "1" ]; then echo "one-file master did not become ready"; exit 1; fi
          curl -fsS -o /dev/null "http://127.0.0.1:18765/app/"
          test -x ./dist/iec104-tester
      - name: Smoke one-file slave (same binary)
        shell: bash
        run: |
          ./dist/iec104-tester --mode slave --no-browser --no-history --http-port 18766 &
          PID=$!
          trap "kill $PID 2>/dev/null || true" EXIT
          ready=0
          for i in $(seq 1 90); do
            sleep 1
            if python -c 'import json,sys,urllib.request; d=json.load(urllib.request.urlopen("http://127.0.0.1:18766/api/status", timeout=2)); sys.exit(0 if d.get("role")=="slave" else 1)' 2>/dev/null; then
              ready=1; break
            fi
          done
          if [ "$ready" != "1" ]; then echo "one-file slave did not become ready"; exit 1; fi

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: webui/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: webui/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check & build
        run: npm run build
      - name: Unit tests with coverage
        run: npm run test:coverage
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: webui/frontend/coverage
          if-no-files-found: ignore
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: webui-spa
          path: webui/static/app
          if-no-files-found: error

  # T15 收尾：前端交互 e2e（Playwright）纳入 CI。
  # - 浏览器用 chromium 通道（runner 无系统 Edge，本地默认 msedge 不可用）；
  # - e2e 的 webServer 经仓库根 venv/bin/python 拉起主站(8765)/子站(8766)，
  #   因此本 job 必须先建 venv 并装后端运行时依赖（requirements.txt）；
  # - specs/*.ts 经 NODE_PATH 解析前端 node_modules 里的 @playwright/test；
  # - 串行（workers=1，配置内定）：主/子站引擎共用 IEC 2404，不可并行；
  # - 失败时上传 Playwright 产物（trace/报告输出目录）辅助排查。
  frontend-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Create backend venv (e2e webServer 启动 app.py 所需)
        run: |
          python -m venv venv
          venv/bin/pip install -r requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: webui/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: webui/frontend
      - name: Type-check & build (e2e 服务 SPA 与源码一致)
        run: npm run build
        working-directory: webui/frontend
      - name: Unit tests (vitest)
        run: npx vitest run
        working-directory: webui/frontend
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
        working-directory: webui/frontend
      - name: Run e2e (chromium channel)
        env:
          E2E_CHANNEL: chromium
        run: |
          NODE_PATH="$PWD/webui/frontend/node_modules" \
            webui/frontend/node_modules/.bin/playwright test --config tests/e2e/playwright.config.ts
      - name: Upload e2e artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: tests/e2e/.playwright-artifacts/
          include-hidden-files: true
          if-no-files-found: error

  # C2：全流程验收（qa_full_flow.py）纳入 CI。
  # 脚本走真实 HTTP/WS/TCP（主站 8765 / 子站 8766 / IEC 24040），
  # 因此本 job 在同一 step 内拉起两个服务、等就绪、跑验收、退出时回收；
  # 历史库关闭（--no-history）避免 CI 磁盘写入；失败上传两端日志。
  e2e-full-flow:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Run full-flow acceptance (12 stages, real services)
        run: |
          set -euo pipefail
          python app.py --mode slave --no-browser --no-history \
            --http-port 8766 --port 24040 > slave.log 2>&1 &
          SLAVE_PID=$!
          python app.py --mode master --no-browser --no-history \
            --http-port 8765 > master.log 2>&1 &
          MASTER_PID=$!
          trap 'kill $SLAVE_PID $MASTER_PID 2>/dev/null || true' EXIT

          ready=0
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8765/api/status >/dev/null \
               && curl -sf http://127.0.0.1:8766/api/status >/dev/null; then
              echo "services ready after ${i}s"
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "services failed to start"
            tail -N 80 master.log slave.log || true
            exit 1
          fi

          python tests/e2e/qa_full_flow.py
      - name: Upload service logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-full-flow-logs
          path: |
            master.log
            slave.log
          if-no-files-found: ignore
