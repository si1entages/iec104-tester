#     name: VendorAlarm
#     fields:
#       - {name: level, type: u8}
#       - {name: value, type: i16}
#       - {name: qds,   type: qds}     # 品质描述词(1B)
#       - {name: ts,    type: cp56}    # CP56Time2a 时标(7B)
