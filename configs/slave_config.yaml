# IEC 60870-5-104 子站配置示例
mode: slave

connection:
  host: "0.0.0.0"
  port: 2404
  common_addr: 1
  max_connections: 16

timers:
  t0: 30
  t1: 15
  t2: 10
  t3: 20

flow_control:
  k: 12
  w: 8

slave:
  spontaneous_enabled: true
  simulation_enabled: false
  yx_interval: 5.0
  yc_interval: 2.0
  yx_change_rate: 0.1
  yc_change_range: 0.05

display:
  theme: dark
  refresh_interval_ms: 500

point_table:
  file: ""
  auto_generate: true
  yx_count: 100
  yc_count: 50
  yk_count: 20
  ym_count: 10

# 历史库（默认开启；命令行 --no-history 可关闭）
history:
  enabled: true
  dir: ""                 # 空 = 项目根目录下的 data/
  retention_days: 7       # 保留天数，<=0 不按时间清理
  max_size_mb: 512        # 容量上限(MB)，超出按最旧优先淘汰；<=0 不限制
  flush_interval: 5.0     # 批量落盘间隔(秒)

# 自定义（非标准厂商私有）TypeID —— 使私有类型可编解码往返（默认空）
# custom_types:
#   - type_id: 128
#     name: VendorAlarm
#     fields:
#       - {name: level, type: u8}
#       - {name: value, type: i16}
#       - {name: qds,   type: qds}     # 品质描述词(1B)
#       - {name: ts,    type: cp56}    # CP56Time2a 时标(7B)

# TLS 传输层加密（T20 / IEC 62351 的传输层部分）。默认关闭。
# 完整说明与证书生成步骤见 docs/tls.md
tls:
  enabled: false
  certfile: ""          # 子站必填：本端证书 (PEM)
  keyfile: ""           # 本端私钥；空 = 与证书同文件
  cafile: ""            # 受信 CA；verify_client=true 时必填
  verify: true          # 子站此字段不生效（仅供主站）
  verify_client: false  # true = 要求并校验客户端证书（双向认证 / mTLS）
  server_hostname: ""   # 子站此字段不生效（仅供主站）
