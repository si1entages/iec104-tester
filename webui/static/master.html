<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IEC104 主站测试工具</title>
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">IEC104 <span>主站</span></div>
    <div class="dot" id="st-dot"></div>
    <div class="field"><label>主机</label><input id="host" value="127.0.0.1" /></div>
    <div class="field"><label>端口</label><input id="port" type="number" value="2404" /></div>
    <div class="field"><label>地址</label><input id="addr" type="number" value="1" /></div>
    <button class="btn primary" id="btn-conn">连接</button>
    <button class="btn danger" id="btn-disc" disabled>断开</button>
    <button class="btn" id="btn-local">连本地</button>
    <button class="btn" id="btn-gi" disabled>立即总召</button>
    <button class="btn" id="btn-ci" disabled>累计量召</button>
    <button class="btn" id="btn-clock" disabled>时钟同步</button>
    <button class="btn" id="btn-reset" disabled>复位</button>
    <button class="btn" id="btn-test" disabled>测试</button>
  </header>

  <main class="main">
    <section class="panel">
      <div class="panel-h">
        <h3>定义表</h3>
        <div class="tabs">
          <div class="tab active" data-t="ALL">全部</div>
          <div class="tab" data-t="YX">遥信</div>
          <div class="tab" data-t="YC">遥测</div>
          <div class="tab" data-t="YK">遥控</div>
          <div class="tab" data-t="YM">遥脉</div>
        </div>
      </div>
      <div class="scroll">
        <table class="grid">
          <thead><tr>
            <th>IOA</th><th>类型</th><th>名称</th><th>组</th><th>值</th><th>品质</th><th>操作</th>
          </tr></thead>
          <tbody id="grid-body"></tbody>
        </table>
      </div>
    </section>

    <aside class="panel side">
      <div class="card">
        <h4>系统命令</h4>
        <div class="row">
          <span class="muted">1–16=组召唤 / 20=站召唤</span>
          <input id="qoi" type="number" min="1" max="20" value="20"
                 title="合法取值：1-16（组召唤）或 20（站召唤）" />
          <button class="btn" id="btn-gi-qoi">召唤</button>
        </div>
        <div class="row">
          <button class="btn" id="btn-read">读命令</button>
        </div>
      </div>
      <div class="card">
        <h4>文件 / 参数</h4>
        <div class="row">
          <button class="btn" id="btn-file-dir">目录</button>
          <input id="file-name" type="number" value="1" style="width:70px" />
          <button class="btn" id="btn-file-sel">选择</button>
          <button class="btn" id="btn-file-req">召唤</button>
        </div>
        <div class="row">
          <select id="param-kind">
            <option value="float">参数-短浮点</option>
            <option value="normalized">参数-归一化</option>
            <option value="scaled">参数-标度化</option>
            <option value="activation">参数激活</option>
          </select>
          <input id="param-val" type="number" step="0.01" value="0" style="width:80px" />
          <button class="btn" id="btn-param">下发</button>
        </div>
      </div>
      <div class="card">
        <h4>遥控 / 设点</h4>
        <div class="row">
          <span class="muted">IOA</span><input id="cmd-ioa" type="number" value="1" class="grow" />
        </div>
        <div class="row">
          <button class="btn" id="yk-off">遥控分</button>
          <button class="btn primary" id="yk-on">遥控合</button>
        </div>
        <div class="row">
          <input id="sp-val" type="number" step="0.01" value="0" class="grow" />
          <button class="btn primary" id="sp-send">设点</button>
        </div>
      </div>
      <div class="card">
        <h4>点表</h4>
        <div class="row">
          <button class="btn" id="btn-export-yaml">导出 YAML</button>
          <button class="btn" id="btn-export-csv">导出 CSV</button>
          <button class="btn" id="btn-export-ses">导出会话</button>
        </div>
        <div class="row">
          <input type="file" id="import-yaml" accept=".yaml,.yml,text/yaml" class="grow" />
        </div>
      </div>
      <div class="card">
        <h4>提示</h4>
        <div class="muted">可另开「IEC104 子站」窗口联调。报文行含 U/S/I 与 TypeID 摘要。</div>
      </div>
    </aside>
  </main>

  <section class="bottom" id="bottom">
    <div class="bottom-tabs"><span class="muted">报文 / 事件</span></div>
    <div class="bottom-body">
      <div class="feed" id="feed-frames" role="log" aria-label="报文流"></div>
      <div class="feed" id="feed-events" role="log" aria-label="事件流"></div>
    </div>
  </section>

  <footer class="statusbar">
    <span id="st-conn">未连接</span>
    <span id="st-traffic">TX 0 / RX 0</span>
    <span id="st-seq">VS/VR -/-</span>
    <span id="st-points">点 0</span>
  </footer>
</div>
<script src="/static/js/app.js"></script>
<script>
IEC104.state.role = "master";
IEC104.bindTabs();
IEC104.connectWs();

const { api, toast } = IEC104;

// QOI 合法取值：1-16（组召唤）或 20（站召唤）。
// 17-19 等空缺值 / 非整数 / 空值均非法（后端 general_interrogation 会抛 ValueError）。
function isValidQoi(v) {
  const n = Number(v);
  return Number.isInteger(n) && ((n >= 1 && n <= 16) || n === 20);
}

$("#btn-conn").onclick = async () => {
  const r = await api("/api/master/start", {
    host: $("#host").value, port: +$("#port").value, addr: +$("#addr").value,
  });
  toast(r.ok ? "正在连接…" : r.error || "失败");
  if (r.ok) {
    $("#btn-conn").disabled = true;
    $("#btn-disc").disabled = false;
    for (const id of ["#btn-gi", "#btn-ci", "#btn-clock", "#btn-reset", "#btn-test"]) $(id).disabled = false;
  }
};
$("#btn-disc").onclick = async () => {
  await api("/api/master/stop");
  $("#btn-conn").disabled = false;
  $("#btn-disc").disabled = true;
  for (const id of ["#btn-gi", "#btn-ci", "#btn-clock", "#btn-reset", "#btn-test"]) $(id).disabled = true;
  toast("已断开");
};
$("#btn-local").onclick = () => { $("#host").value = "127.0.0.1"; $("#btn-conn").click(); };
$("#btn-gi").onclick = async () => {
  const r = await api("/api/master/gi", { qoi: 20 });
  toast(r.ok ? "总召唤已发" : r.error || "失败");
};
$("#btn-gi-qoi").onclick = async () => {
  const raw = $("#qoi").value;
  if (!isValidQoi(raw)) {
    toast("QOI 仅支持 1-16（组召唤）或 20（站召唤）");
    return;
  }
  const r = await api("/api/master/gi", { qoi: Number(raw) });
  toast(r.ok ? "召唤已发" : r.error || "失败");
};
$("#btn-ci").onclick = async () => {
  const r = await api("/api/master/ci");
  toast(r.ok ? "累计量召唤已发" : r.error || "失败");
};
$("#btn-clock").onclick = async () => {
  const r = await api("/api/master/clock");
  toast(r.ok ? "时钟同步已发" : r.error || "失败");
};
$("#btn-reset").onclick = async () => {
  const r = await api("/api/master/reset");
  toast(r.ok ? "复位已发" : r.error || "失败");
};
$("#btn-test").onclick = async () => {
  const r = await api("/api/master/test");
  toast(r.ok ? "测试命令已发" : r.error || "失败");
};
$("#btn-read").onclick = async () => {
  const r = await api("/api/master/read", { ioa: +$("#cmd-ioa").value });
  toast(r.ok ? "读命令已发" : r.error || "失败");
};
$("#btn-file-dir").onclick = async () => {
  const r = await api("/api/master/file", { action: "directory", ioa: 0 });
  toast(r.ok ? "文件目录请求已发" : r.error || "失败");
};
$("#btn-file-sel").onclick = async () => {
  const r = await api("/api/master/file", { action: "select", ioa: 0, file_name: +$("#file-name").value || 1 });
  toast(r.ok ? "文件选择已发" : r.error || "失败");
};
$("#btn-file-req").onclick = async () => {
  const r = await api("/api/master/file", { action: "request", ioa: 0, file_name: +$("#file-name").value || 1 });
  toast(r.ok ? "文件召唤已发" : r.error || "失败");
};
$("#btn-param").onclick = async () => {
  const r = await api("/api/master/param", {
    kind: $("#param-kind").value,
    ioa: +$("#cmd-ioa").value,
    value: +$("#param-val").value,
  });
  toast(r.ok ? "参数已发" : r.error || "失败");
};
$("#btn-export-yaml").onclick = () => { location.href = "/api/points/yaml"; };
$("#btn-export-csv").onclick = () => { location.href = "/api/export/points.csv"; };
$("#btn-export-ses").onclick = () => { location.href = "/api/export/session.json"; };
$("#import-yaml").onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const text = await file.text();
  const r = await fetch("/api/points/yaml", { method: "POST", body: text });
  const body = await r.json();
  toast(body.ok ? `已导入 ${body.points} 点` : body.error || "失败");
  if (body.ok) IEC104.refreshPoints();
};
$("#yk-on").onclick = () => {
  const ioa = +$("#cmd-ioa").value;
  api("/api/master/yk", { ioa, state: 1 }).then((r) => toast(r.ok ? "合命令已发" : r.error));
};
$("#yk-off").onclick = () => {
  const ioa = +$("#cmd-ioa").value;
  api("/api/master/yk", { ioa, state: 0 }).then((r) => toast(r.ok ? "分命令已发" : r.error));
};
$("#sp-send").onclick = () => {
  const ioa = +$("#cmd-ioa").value, value = +$("#sp-val").value;
  api("/api/master/setpoint", { ioa, value }).then((r) => toast(r.ok ? "设点已发" : r.error));
};
</script>
</body>
</html>
