<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IEC104 子站测试工具</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">IEC104 <span>子站</span></div>
    <div class="dot" id="st-dot"></div>
    <div class="field"><label>绑定</label><input id="host" value="0.0.0.0" /></div>
    <div class="field"><label>端口</label><input id="port" type="number" value="2404" /></div>
    <div class="field"><label>地址</label><input id="addr" type="number" value="1" /></div>
    <button class="btn success" id="btn-start">启动监听</button>
    <button class="btn danger" id="btn-stop" disabled>停止</button>
  </header>

  <main class="main">
    <section class="panel">
      <div class="panel-h">
        <h3>点表</h3>
        <div class="tabs">
          <div class="tab active" data-t="ALL">全部</div>
          <div class="tab" data-t="YX">遥信</div>
          <div class="tab" data-t="YC">遥测</div>
          <div class="tab" data-t="YK">遥控</div>
          <div class="tab" data-t="YM">遥脉</div>
        </div>
      </div>
      <div class="scroll">
        <table class="grid">
          <thead><tr>
            <th>IOA</th><th>类型</th><th>名称</th><th>组</th><th>值</th><th>品质</th><th>操作</th>
          </tr></thead>
          <tbody id="grid-body"></tbody>
        </table>
      </div>
    </section>

    <aside class="panel side">
      <div class="card">
        <h4>客户端</h4>
        <div id="st-clients" class="muted">客户端 0</div>
      </div>
      <div class="card">
        <h4>响应注入</h4>
        <div class="row">
          <label class="muted">GI延迟(s)</label>
          <input id="gi-delay" type="number" step="0.1" value="0" />
          <label class="muted">命令延迟</label>
          <input id="cmd-delay" type="number" step="0.1" value="0" />
        </div>
        <div class="row">
          <label class="muted">丢帧率</label>
          <input id="drop-rate" type="number" step="0.05" min="0" max="1" value="0" />
          <label><input id="no-resp" type="checkbox" /> 不响应</label>
          <label><input id="corrupt" type="checkbox" /> 损坏帧</label>
        </div>
        <div class="row">
          <label title="应答的传送原因整体 +1（错位），用于验证主站对 COT 的严格校验">
            <input id="wrong-cot" type="checkbox" /> 返回错误COT
          </label>
        </div>
        <button class="btn primary" id="btn-resp">应用响应配置</button>
      </div>
      <div class="card">
        <h4>数据模拟</h4>
        <div class="row">
          <label><input id="sim-on" type="checkbox" /> 自动变化</label>
          <button class="btn" id="btn-sim">应用</button>
        </div>
        <div class="row">
          <span class="muted">累计量</span>
          <input id="ym-ioa" type="number" value="3001" style="width:74px" />
          <input id="ym-val" type="number" value="0" style="width:74px" />
          <button class="btn" id="btn-ym">置值上送</button>
        </div>
      </div>
      <div class="card">
        <h4>测试报文注入</h4>
        <div class="row">
          <span class="muted">继保事件</span>
          <input id="ep-ioa" type="number" value="5001" style="width:74px" />
          <input id="ep-val" type="number" value="1" style="width:60px" />
          <button class="btn" id="btn-ep">上送 M_EP</button>
        </div>
        <div class="row">
          <span class="muted">成组单点</span>
          <input id="ps-ioa" type="number" value="5101" style="width:74px" />
          <input id="ps-states" class="grow" placeholder="状态位 1,0,1" />
          <button class="btn" id="btn-ps">上送 M_PS</button>
        </div>
        <div class="muted">均为 COT=3 带时标突发报文，用于验证主站对非常规来报的处理。</div>
      </div>
      <div class="card">
        <h4>批量操作</h4>
        <div class="row">
          <span class="muted">选中页签类型</span>
          <select id="batch-type">
            <option>YX</option><option>YC</option><option>YK</option><option>YM</option>
          </select>
          <input id="batch-ioas" class="grow" placeholder="IOA 逗号分隔,如 1,2,3" />
        </div>
        <div class="row">
          <button class="btn" id="batch-en">启用</button>
          <button class="btn" id="batch-dis">禁用</button>
          <input id="batch-group" type="number" value="1" style="width:60px" />
          <button class="btn" id="batch-grp">改组</button>
        </div>
      </div>
      <div class="card">
        <h4>联调提示</h4>
        <div class="muted">启动监听后，打开「IEC104 主站」点「连本地」。改 YX、YC 会立刻自发上送。</div>
      </div>
    </aside>
  </main>

  <section class="bottom" id="bottom">
    <div class="bottom-tabs">
      <span class="muted">报文 / 事件 / 日志</span>
      <span class="log-tools">
        <select id="log-level" title="最低级别">
          <option value="DEBUG">DEBUG+</option>
          <option value="INFO">INFO+</option>
          <option value="WARNING">WARNING+</option>
          <option value="ERROR">ERROR+</option>
        </select>
        <select id="log-category">
          <option value="all">全部类别</option>
          <option value="connection">连接</option>
          <option value="protocol">协议</option>
          <option value="command">命令</option>
          <option value="data">数据</option>
          <option value="ui">界面</option>
          <option value="system">系统</option>
        </select>
        <input id="log-q" placeholder="关键字过滤" class="grow" />
        <button class="btn" id="log-clear">清屏</button>
        <button class="btn" id="log-export">导出</button>
      </span>
    </div>
    <div class="bottom-body three">
      <div class="feed" id="feed-frames" role="log" aria-label="报文流"></div>
      <div class="feed" id="feed-events" role="log" aria-label="事件流"></div>
      <div class="feed" id="feed-logs" role="log" aria-label="日志流"></div>
    </div>
  </section>

  <footer class="statusbar">
    <span id="st-conn">状态 未连接</span>
    <span id="st-traffic">报文 TX 0 / RX 0</span>
    <span id="st-seq">序号 VS/VR -/- 窗口 -</span>
    <span id="st-points">点数 0</span>
    <span id="st-clients-bar">客户端 0</span>
  </footer>
</div>
<script src="/static/js/app.js"></script>
<script>
IEC104.state.role = "slave";
IEC104.bindTabs();
IEC104.connectWs();
const { api, toast } = IEC104;
$("#btn-start").onclick = async () => {
  const r = await api("/api/slave/start", {
    host: $("#host").value, port: +$("#port").value, addr: +$("#addr").value,
  });
  toast(r.ok ? "监听已启动" : r.error || "失败");
  if (r.ok) {
    $("#btn-start").disabled = true;
    $("#btn-stop").disabled = false;
  }
  IEC104.requestRefresh();   // 立刻按服务端真实状态对齐（含 already running 等分支）
};
$("#btn-stop").onclick = async () => {
  await api("/api/slave/stop");
  $("#btn-start").disabled = false;
  $("#btn-stop").disabled = true;
  toast("已停止");
  IEC104.requestRefresh();
};
$("#btn-resp").onclick = async () => {
  const r = await api("/api/slave/response", {
    delays: { gi: +$("#gi-delay").value || 0, command: +$("#cmd-delay").value || 0, data: 0 },
    errors: {
      drop_frames: +$("#drop-rate").value > 0,
      drop_rate: +$("#drop-rate").value || 0,
      corrupt: $("#corrupt").checked,
      no_response: $("#no-resp").checked,
      wrong_cot: $("#wrong-cot").checked,
    },
  });
  toast(r.ok ? "响应配置已应用" : r.error || "失败");
};
$("#btn-sim").onclick = async () => {
  const r = await api("/api/slave/sim", { enabled: $("#sim-on").checked });
  toast(r.ok ? ($("#sim-on").checked ? "模拟已开" : "模拟已关") : r.error || "失败");
};
function batch(action) {
  const ioas = $("#batch-ioas").value.split(/[,，\s]+/).map(Number).filter((n) => !isNaN(n));
  const body = { type: $("#batch-type").value, ioas, action };
  if (action === "group") body.group = +$("#batch-group").value;
  api("/api/points/batch", body).then((r) => {
    toast(r.ok ? `已更新 ${r.changed} 点` : r.error || "失败");
    if (r.ok) IEC104.refreshPoints();
  });
}
$("#batch-en").onclick = () => batch("enable");
$("#batch-dis").onclick = () => batch("disable");
$("#batch-grp").onclick = () => batch("group");
$("#btn-ym").onclick = async () => {
  const r = await api("/api/slave/ym", {
    ioa: +$("#ym-ioa").value, value: +$("#ym-val").value,
  });
  toast(r.ok ? `累计量 ${$("#ym-ioa").value} → ${$("#ym-val").value}` : r.error || "失败");
  if (r.ok) IEC104.refreshPoints();
};
$("#btn-ep").onclick = async () => {
  const r = await api("/api/slave/ep", {
    ioa: +$("#ep-ioa").value, event_value: +$("#ep-val").value, with_time: true,
  });
  toast(r.ok ? "继保事件已上送 (M_EP_TD_1)" : r.error || "失败");
};
$("#btn-ps").onclick = async () => {
  const states = $("#ps-states").value.split(/[,\s]+/).map(Number)
    .filter((v) => v === 0 || v === 1);
  if (!states.length) { toast("状态位须为 0/1，如 1,0,1"); return; }
  const r = await api("/api/slave/ps", { ioa: +$("#ps-ioa").value, states });
  toast(r.ok ? `成组单点已上送 (${states.length} 点)` : r.error || "失败");
};
</script>
</body>
</html>
