<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IEC104 子站测试工具</title>
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">IEC104 <span>子站</span></div>
    <div class="dot" id="st-dot"></div>
    <div class="field"><label>绑定</label><input id="host" value="0.0.0.0" /></div>
    <div class="field"><label>端口</label><input id="port" type="number" value="2404" /></div>
    <div class="field"><label>地址</label><input id="addr" type="number" value="1" /></div>
    <button class="btn success" id="btn-start">启动监听</button>
    <button class="btn danger" id="btn-stop" disabled>停止</button>
  </header>

  <main class="main">
    <section class="panel">
      <div class="panel-h">
        <h3>点表</h3>
        <div class="tabs">
          <div class="tab active" data-t="ALL">全部</div>
          <div class="tab" data-t="YX">遥信</div>
          <div class="tab" data-t="YC">遥测</div>
          <div class="tab" data-t="YK">遥控</div>
          <div class="tab" data-t="YM">遥脉</div>
        </div>
      </div>
      <div class="scroll">
        <table class="grid">
          <thead><tr>
            <th>IOA</th><th>类型</th><th>名称</th><th>组</th><th>值</th><th>品质</th><th>操作</th>
          </tr></thead>
          <tbody id="grid-body"></tbody>
        </table>
      </div>
    </section>

    <aside class="panel side">
      <div class="card">
        <h4>客户端</h4>
        <div id="st-clients" class="muted">客户端 0</div>
      </div>
      <div class="card">
        <h4>响应注入</h4>
        <div class="row">
          <label class="muted">GI延迟(s)</label>
          <input id="gi-delay" type="number" step="0.1" value="0" />
          <label class="muted">命令延迟</label>
          <input id="cmd-delay" type="number" step="0.1" value="0" />
        </div>
        <div class="row">
          <label class="muted">丢帧率</label>
          <input id="drop-rate" type="number" step="0.05" min="0" max="1" value="0" />
          <label><input id="no-resp" type="checkbox" /> 不响应</label>
          <label><input id="corrupt" type="checkbox" /> 损坏帧</label>
        </div>
        <button class="btn primary" id="btn-resp">应用响应配置</button>
      </div>
      <div class="card">
        <h4>数据模拟</h4>
        <div class="row">
          <label><input id="sim-on" type="checkbox" /> 自动变化</label>
          <button class="btn" id="btn-sim">应用</button>
        </div>
      </div>
      <div class="card">
        <h4>批量操作</h4>
        <div class="row">
          <span class="muted">选中页签类型</span>
          <select id="batch-type">
            <option>YX</option><option>YC</option><option>YK</option><option>YM</option>
          </select>
          <input id="batch-ioas" class="grow" placeholder="IOA 逗号分隔,如 1,2,3" />
        </div>
        <div class="row">
          <button class="btn" id="batch-en">启用</button>
          <button class="btn" id="batch-dis">禁用</button>
          <input id="batch-group" type="number" value="1" style="width:60px" />
          <button class="btn" id="batch-grp">改组</button>
        </div>
      </div>
      <div class="card">
        <h4>联调提示</h4>
        <div class="muted">启动监听后，打开「IEC104 主站」点「连本地」。改 YX、YC 会立刻自发上送。</div>
      </div>
    </aside>
  </main>

  <section class="bottom" id="bottom">
    <div class="bottom-tabs"><span class="muted">报文 / 事件</span></div>
    <div class="bottom-body">
      <div class="feed" id="feed-frames" role="log" aria-label="报文流"></div>
      <div class="feed" id="feed-events" role="log" aria-label="事件流"></div>
    </div>
  </section>

  <footer class="statusbar">
    <span id="st-conn">未连接</span>
    <span id="st-traffic">TX 0 / RX 0</span>
    <span id="st-seq">VS/VR -/-</span>
    <span id="st-points">点 0</span>
    <span id="st-clients"></span>
  </footer>
</div>
<script src="/static/js/app.js"></script>
<script>
IEC104.state.role = "slave";
IEC104.bindTabs();
IEC104.connectWs();
const { api, toast } = IEC104;
$("#btn-start").onclick = async () => {
  const r = await api("/api/slave/start", {
    host: $("#host").value, port: +$("#port").value, addr: +$("#addr").value,
  });
  toast(r.ok ? "监听已启动" : r.error || "失败");
  if (r.ok) {
    $("#btn-start").disabled = true;
    $("#btn-stop").disabled = false;
  }
};
$("#btn-stop").onclick = async () => {
  await api("/api/slave/stop");
  $("#btn-start").disabled = false;
  $("#btn-stop").disabled = true;
  toast("已停止");
};
$("#btn-resp").onclick = async () => {
  const r = await api("/api/slave/response", {
    delays: { gi: +$("#gi-delay").value || 0, command: +$("#cmd-delay").value || 0, data: 0 },
    errors: {
      drop_frames: +$("#drop-rate").value > 0,
      drop_rate: +$("#drop-rate").value || 0,
      corrupt: $("#corrupt").checked,
      no_response: $("#no-resp").checked,
      wrong_cot: false,
    },
  });
  toast(r.ok ? "响应配置已应用" : r.error || "失败");
};
$("#btn-sim").onclick = async () => {
  const r = await api("/api/slave/sim", { enabled: $("#sim-on").checked });
  toast(r.ok ? ($("#sim-on").checked ? "模拟已开" : "模拟已关") : r.error || "失败");
};
function batch(action) {
  const ioas = $("#batch-ioas").value.split(/[,，\s]+/).map(Number).filter((n) => !isNaN(n));
  const body = { type: $("#batch-type").value, ioas, action };
  if (action === "group") body.group = +$("#batch-group").value;
  api("/api/points/batch", body).then((r) => {
    toast(r.ok ? `已更新 ${r.changed} 点` : r.error || "失败");
    if (r.ok) IEC104.refreshPoints();
  });
}
$("#batch-en").onclick = () => batch("enable");
$("#batch-dis").onclick = () => batch("disable");
$("#batch-grp").onclick = () => batch("group");
</script>
</body>
</html>
