# 升降命令测试
# 验证: 升降命令选择/执行流程

name: regulating_command
description: "升降命令测试"
version: "1.0"
tags: [regulating, master, functional]

config:
  role: master
  timeout: 30
  connection:
    host: "127.0.0.1"
    port: 2404
    common_addr: 1
    reconnect: false
  timers:
    t0: 10
    t1: 10
    t2: 5
    t3: 15
  flow_control:
    k: 12
    w: 8

steps:
  # Step 0: 建立连接
  - action: connect
    description: "建立 TCP 连接"
    assert:
      - type: state
        params: { expected: "connected" }

  # Step 1: 等待 STARTDT 完成
  - action: wait_state
    description: "等待进入运行态"
    params:
      state: running
      timeout: 10
    assert:
      - type: state
        params: { expected: "running" }

  # Step 2: 发送升降命令-升一步
  - action: regulating_step_command
    description: "发送升降命令-升一步 (C_RC_NA_1)"
    params:
      ioa: 100
      state: 2
      select: false
      qu: 0
    assert:
      - type: frame_count
        params: { direction: tx, frame_type: I, min: 1 }

  # Step 3: 等待命令确认
  - action: wait_frames
    description: "等待子站命令确认"
    params:
      direction: rx
      count: 1
      frame_type: I
      timeout: 5

  # Step 4: 发送升降命令-降一步
  - action: regulating_step_command
    description: "发送升降命令-降一步 (C_RC_NA_1)"
    params:
      ioa: 100
      state: 1
      select: false
      qu: 0
    assert:
      - type: frame_count
        params: { direction: tx, frame_type: I, min: 1 }

  # Step 5: 等待命令确认
  - action: wait_frames
    description: "等待子站命令确认"
    params:
      direction: rx
      count: 1
      frame_type: I
      timeout: 5

  # Step 6: 发送升降命令-选择
  - action: regulating_step_command
    description: "发送升降命令-选择升一步"
    params:
      ioa: 100
      state: 2
      select: true
      qu: 0
    assert:
      - type: frame_count
        params: { direction: tx, frame_type: I, min: 1 }

  # Step 7: 等待选择确认
  - action: wait_frames
    description: "等待子站选择确认"
    params:
      direction: rx
      count: 1
      frame_type: I
      timeout: 5

  # Step 8: 等待一段时间
  - action: wait
    description: "等待数据传输完成"
    params:
      seconds: 1

  # Step 9: 记录统计信息
  - action: log
    description: "记录统计信息"
    params:
      message: "升降命令测试完成"

  # Step 10: 断开连接
  - action: disconnect
    description: "断开连接"
    assert:
      - type: state
        params: { expected: "disconnected" }
