# 基础连接与总召测试
# 验证: 连接 → STARTDT → 总召 → 数据接收 → 断开

name: basic_connection_gi
description: "基础连接与总召全流程测试"
version: "1.0"
tags: [basic, master, smoke]

config:
  role: master
  timeout: 30
  connection:
    host: "127.0.0.1"
    port: 2404
    common_addr: 1
    reconnect: false
  timers:
    t0: 10
    t1: 10
    t2: 5
    t3: 15
  flow_control:
    k: 12
    w: 8

steps:
  # Step 0: 建立连接
  - action: connect
    description: "建立 TCP 连接"
    assert:
      - type: state
        params: { expected: "connected" }

  # Step 1: 等待 STARTDT 完成
  - action: wait_state
    description: "等待进入运行态 (STARTDT CON)"
    params:
      state: running
      timeout: 10
    assert:
      - type: state
        params: { expected: "running" }

  # Step 2: 发送总召唤
  - action: general_interrogation
    description: "发送总召唤命令 (QOI=20)"
    params:
      qoi: 20
    assert:
      - type: frame_count
        params: { direction: tx, frame_type: I, min: 1 }

  # Step 3: 等待总召唤响应
  - action: wait_frames
    description: "等待子站响应数据"
    params:
      direction: rx
      count: 1
      frame_type: I
      timeout: 10
    assert:
      - type: frame_count
        params: { direction: rx, frame_type: I, min: 1 }

  # Step 4: 等待一段时间收集更多数据
  - action: wait
    description: "等待数据传输完成"
    params:
      seconds: 2

  # Step 5: 验证收到了足够的帧
  - action: log
    description: "记录统计信息"
    params:
      message: "测试完成，检查收发帧数"

  # Step 6: 断开连接
  - action: disconnect
    description: "断开连接"
    assert:
      - type: state
        params: { expected: "disconnected" }
