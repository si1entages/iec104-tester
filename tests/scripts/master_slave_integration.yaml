# 主子站联调测试
# 验证: 主站和子站端到端通信

name: master_slave_integration
description: "主子站联调测试"
version: "1.0"
tags: [integration, master, slave, smoke]

config:
  role: master
  timeout: 60
  connection:
    host: "127.0.0.1"
    port: 2404
    common_addr: 1
    reconnect: false
  timers:
    t0: 10
    t1: 10
    t2: 5
    t3: 15
  flow_control:
    k: 12
    w: 8

steps:
  # Step 0: 建立连接
  - action: connect
    description: "建立 TCP 连接"
    assert:
      - type: state
        params: { expected: "connected" }

  # Step 1: 等待 STARTDT 完成
  - action: wait_state
    description: "等待进入运行态"
    params:
      state: running
      timeout: 10
    assert:
      - type: state
        params: { expected: "running" }

  # Step 2: 发送总召唤
  - action: general_interrogation
    description: "发送总召唤命令"
    params:
      qoi: 20
    assert:
      - type: frame_count
        params: { direction: tx, frame_type: I, min: 1 }

  # Step 3: 等待总召唤响应
  - action: wait_frames
    description: "等待子站总召唤响应"
    params:
      direction: rx
      count: 1
      frame_type: I
      timeout: 10

  # Step 4: 等待数据传输完成
  - action: wait
    description: "等待数据传输完成"
    params:
      seconds: 2

  # Step 5: 发送单命令
  - action: single_command
    description: "发送单命令"
    params:
      ioa: 1
      state: true
      select: false
    assert:
      - type: frame_count
        params: { direction: tx, frame_type: I, min: 1 }

  # Step 6: 等待命令确认
  - action: wait_frames
    description: "等待子站命令确认"
    params:
      direction: rx
      count: 1
      frame_type: I
      timeout: 5

  # Step 7: 发送时钟同步
  - action: clock_sync
    description: "发送时钟同步命令"
    assert:
      - type: frame_count
        params: { direction: tx, frame_type: I, min: 1 }

  # Step 8: 等待时钟同步确认
  - action: wait_frames
    description: "等待子站时钟同步确认"
    params:
      direction: rx
      count: 1
      frame_type: I
      timeout: 5

  # Step 9: 发送累计量召唤
  - action: counter_interrogation
    description: "发送累计量召唤命令"
    params:
      qcc: 0
    assert:
      - type: frame_count
        params: { direction: tx, frame_type: I, min: 1 }

  # Step 10: 等待累计量响应
  - action: wait_frames
    description: "等待子站累计量响应"
    params:
      direction: rx
      count: 1
      frame_type: I
      timeout: 10

  # Step 11: 等待数据传输完成
  - action: wait
    description: "等待数据传输完成"
    params:
      seconds: 2

  # Step 12: 记录统计信息
  - action: log
    description: "记录统计信息"
    params:
      message: "主子站联调测试完成"

  # Step 13: 断开连接
  - action: disconnect
    description: "断开连接"
    assert:
      - type: state
        params: { expected: "disconnected" }
